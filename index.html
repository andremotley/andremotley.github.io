<style>
:root{
  --bg:#f6f4ef; --surface:#fffdf9; --ink:#1f2328; --muted:#6a6f76; --line:#e3dfd5;
  --accent:#2f5d50; --accent-ink:#fff; --good:#2f7d4f; --bad:#b4472f; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181a; --surface:#1d2124; --ink:#e8e6e1; --muted:#98a0a6; --line:#2d3337;
    --accent:#6fb59f; --accent-ink:#0f1a16; --good:#69c08a; --bad:#e27d65; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15181a; --surface:#1d2124; --ink:#e8e6e1; --muted:#98a0a6; --line:#2d3337;
  --accent:#6fb59f; --accent-ink:#0f1a16; --good:#69c08a; --bad:#e27d65; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
button,.card,.tabs button,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{min-height:44px}
.chip{min-height:44px}
select{min-height:44px}
#stage{touch-action:pan-y}
.hint .touch{display:none}
@media (hover:none){.hint .kbd{display:none}.hint .touch{display:inline}}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
h1 small{color:var(--muted);font-weight:400;margin-left:8px;font-size:.85rem}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,.chip,.search{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
select{cursor:pointer;max-width:100%}
.chip{cursor:pointer;display:inline-flex;gap:6px;align-items:center;user-select:none}
.chip input{accent-color:var(--accent)}
.search{flex:1;min-width:160px;min-height:44px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.card{perspective:1200px;cursor:pointer;margin-bottom:16px}
.card .face{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:280px;padding:28px 28px 24px;display:flex;flex-direction:column;justify-content:center}
.side-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:12px}
.card .text{font-size:1.2rem;line-height:1.6}
.card.is-back .text{font-size:1.05rem}
.card .deck-tag{margin-top:auto;padding-top:18px;font-size:.78rem;color:var(--muted)}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:14px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:.78rem ui-monospace,monospace;background:var(--surface)}
.list{display:flex;flex-direction:column;gap:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
summary{cursor:pointer;padding:12px 16px;list-style:none;display:flex;gap:10px;justify-content:space-between;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary .q{flex:1}
summary .d{color:var(--muted);font-size:.75rem;white-space:nowrap}
details .ans{padding:0 16px 14px;border-top:1px dashed var(--line);padding-top:12px;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:48px 0}
.done{text-align:center;padding:48px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.done h2{margin:0 0 6px}
.mark{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.mark.k{background:var(--good)} .mark.u{background:var(--bad)}
[hidden]{display:none!important}
@media (max-width:520px){.card .face{padding:20px;min-height:240px}.card .text{font-size:1.08rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Flashcards<small id="total"></small></h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-study" aria-selected="true">Study</button>
      <button role="tab" id="tab-browse" aria-selected="false">Browse</button>
    </div>
  </header>

  <div class="controls">
    <select id="deck" aria-label="Deck"></select>
    <label class="chip"><input type="checkbox" id="shuffle"> Shuffle</label>

    <input class="search" id="search" type="search" placeholder="Search cards…" aria-label="Search cards" hidden>

  <section id="study">

    <div class="meta"><span id="pos"></span><span id="stats"></span></div>

  <section id="browse" hidden>
    <div class="meta"><span id="count"></span><button class="btn" id="resetProg" style="padding:2px 12px;font-size:.85rem">Reset progress</button></div>
    <div class="list" id="list"></div>
  </section>
</div>

<script id="data" type="application/json">{"decks": ["ABSC 850 P1", "ABSC 850 P2", "ABSC 850 P3", "ABSC 850 P4", "ABSC 850 P5", "ABSC 850 P6", "ABSC 850 P7", "ABSC 850 P8"], "cards": [{"id": 1790796651890, "deck": "ABSC 850 P1", "q": "Functional Relation", "a": "When we change the independant variable, it reliably causes a change in the dependent variable"}, {"id": 1790796813438, "deck": "ABSC 850 P1", "q": "Determinism", "a": "Where scientists believe that things don’t just happen out of nowhere. One event causes another event to happen in sequence"}, {"id": 1790796891444, "deck": "ABSC 850 P1", "q": "Empiricism", "a": "The practice of objective observation and measurement of the area of interest"}, {"id": 1790796937253, "deck": "ABSC 850 P1", "q": "Experiment", "a": "A controlled comparison of some measure of the phenomena of interest (dependent variable) under two or more different conditions in which only one factor at a time (independent variable) differs from one condition to another"}, {"id": 1790797038765, "deck": "ABSC 850 P1", "q": "Functional Analysis (Skinner)", "a": "Demonstrations of functional relations between environmental variables and behaviour"}, {"id": 1790797066005, "deck": "ABSC 850 P1", "q": "Functional Analysis (Modern)", "a": "An experimental methodology for determining environmental variables and contingencies maintaining problem behaviour"}, {"id": 1790797145040, "deck": "ABSC 850 P1", "q": "Replication", "a": "Repeating of experiments (as well as repeating independent variable conditions)"}, {"id": 1790797199102, "deck": "ABSC 850 P1", "q": "Parsimony", "a": "Requires that all simple, logical explanations for the phenomenon under investigation be ruled out before more complex or abstract explanations are considered"}, {"id": 1790797242988, "deck": "ABSC 850 P1", "q": "Philosophic Doubt", "a": "Requires the scientist to continually question the truthfulness of what is regarded as facts"}, {"id": 1790797274203, "deck": "ABSC 850 P1", "q": "Behaviorism", "a": "The philosophy of the science of behaviour, basic research is the province of the experimental analysis of behaviour, and developing a technology for improving behaviour is the concern of applied behaviour analysis"}, {"id": 1790797343986, "deck": "ABSC 850 P1", "q": "Watsonian Behaviorism", "a": "Became known as stimulus response (S-R) psychology but there was insufficient evidence to support it"}, {"id": 1790797377288, "deck": "ABSC 850 P1", "q": "Mentalism", "a": "The approach to the study of behaviour which assumes that a mental or \"inner\" dimension exists that differs from a behavioural dimension"}, {"id": 1790797437759, "deck": "ABSC 850 P1", "q": "Explanatory Fiction", "a": "A fictituous variable that often is simply another name for the observed behaviour that contributes nothing to an understanding of the variables responsible for developing or maintaining behaviour"}, {"id": 1790797483899, "deck": "ABSC 850 P1", "q": "Pragmatism", "a": "The philosophical position that the truth or value of a scientific statement is determined by the extent to which it promotes effective action"}, {"id": 1790797546136, "deck": "ABSC 850 P1", "q": "Radical Behaviorism", "a": "Attempts to explain all behaviour, incuding private events such as thinking and feeling"}, {"id": 1790797588569, "deck": "ABSC 850 P1", "q": "Methodological Behaviorism", "a": "Denying the existence of \"inner variables\" or considering them to be outside the realm of a scientific account"}, {"id": 1790797746368, "deck": "ABSC 850 P1", "q": "Applied", "a": "Investigates socially significant behaviours with immediate importance to the subject (ex. adding a coping skill intervention that teaches the learner how to appropriately display frustration when they lose a game)"}, {"id": 1790797817585, "deck": "ABSC 850 P1", "q": "Behavioural", "a": "The behavior of interest selected to target in an interventions must be observable and measurable (ex. External behaviors can include behaviors such as talking, crying, hitting, running, and jumping. These are all behaviors that can be quantified and translated into analytical data)"}, {"id": 1790797891396, "deck": "ABSC 850 P1", "q": "Analytic", "a": "All interventions selected by the BCBA are developed from evidence-based research (ex. articles on research that have been published in JABA)"}, {"id": 1790798200933, "deck": "ABSC 850 P1", "q": "Technological", "a": "They are written out clearly and concisely and are intended to be understood by any interventionist carrying out the intervention plan"}, {"id": 1790798308299, "deck": "ABSC 850 P1", "q": "Conceptually Systematic", "a": "All practitioners are implementing research-based techniques and teaching methods in their work (ex. Commonly used teaching techniques employed across sessions and interventions include positive reinforcement, prompting, modeling, and extinction)"}, {"id": 1790798356906, "deck": "ABSC 850 P1", "q": "Effective", "a": "An effective intervention improves the learner’s behavior and reduces their challenging behavior in a practical and functional manner"}, {"id": 1790798412414, "deck": "ABSC 850 P1", "q": "Generality", "a": "If that behavior is able to be sustained over time, appears in different environments and settings, and extends to a range of associated behaviors it is said to have generality"}, {"id": 1790798517412, "deck": "ABSC 850 P2", "q": "Response", "a": "Refers to a specific instance of behavior"}, {"id": 1790798560121, "deck": "ABSC 850 P2", "q": "Response Class", "a": "A group of responses with the same function (that is, each response in the group produces the same effect on the environment). Ex. When a child wants attention, they might achieve this by raising their hand, calling out, or approaching the teacher"}, {"id": 1790799065701, "deck": "ABSC 850 P2", "q": "Response Topography: refers to the physical shape or form of behavior", "a": "Refers to the physical shape or form of behavior (ex. how a person waves to say hello)"}, {"id": 1790799199709, "deck": "ABSC 850 P2", "q": "Repertoire", "a": "A person’s collection of knowledge and skills relevant to particular settings or tasks (ex. Throw a ball, make dinner, ride a bike, raise your hand, scratch your nose, pet a dog)"}, {"id": 1790799367077, "deck": "ABSC 850 P2", "q": "Environment", "a": "Refers to the full set of physical circumstances in which the organism exists"}, {"id": 1790799439015, "deck": "ABSC 850 P2", "q": "Stimulus", "a": "Environmental factors that influence behavior, such as sounds, objects, or social interactions"}, {"id": 1790799601092, "deck": "ABSC 850 P2", "q": "Stimulus Class", "a": "Refers to any group of stimuli sharing common elements (Ex. a french bulldog, Labrador, and Terrier all falling into the stimulus class of dogs)"}, {"id": 1790799876670, "deck": "ABSC 850 P2", "q": "Antcedent", "a": "Refers to environmental conditions or stimulus changes that exist or occur prior to the behavior of interest"}, {"id": 1790799949731, "deck": "ABSC 850 P2", "q": "Consequence", "a": "Is a stimulus change that follows a behavior of interest"}, {"id": 1790800014466, "deck": "ABSC 850 P2", "q": "Socially Mediated Contingency", "a": "Where another person presents an antecedent stimulus and/or the consequence for the behavior"}, {"id": 1790800177258, "deck": "ABSC 850 P2", "q": "Reflex", "a": "An involuntary, automatic response to a specific stimulus. Reflexes are typically hardwired into an organism’s nervous system and occur without conscious thought or control. Reflexes provide the organism with a set of built-in responses to specific stimuli"}, {"id": 1790800642998, "deck": "ABSC 850 P2", "q": "Respondent Behaviour", "a": "Is an action that an organism produces in response to the antcedent stimuli in the environment alone (it is not selected by consequences) and is typically essential for the organism’s survival (ex. blinking when a air is puffed in the eye)"}, {"id": 1790801256043, "deck": "ABSC 850 P2", "q": "Respondent Conditioning (Pavolvian/Classical Conditioning)", "a": "The process of pairing a stimulus that naturally elicits a reflexive response with other stimuli repeatedly until the previously neutral (other) stimuli can elicit the reflexive response independently (ex. the smell of bread being baked eliciting happy memories of baking in childhood)."}, {"id": 1790801372339, "deck": "ABSC 850 P2", "q": "Habituation", "a": "A decrease in responsiveness when an eliciting stimulus is presented repeatedly over a short period of time. Ex. after a party when you pop the first few balloons you will likely jump at first, but after popping a many balloons over a short period of time, the reaction of jumping decreases"}, {"id": 1790801593448, "deck": "ABSC 850 P2", "q": "Stimulus-Stimulus Pairing", "a": "A procedure in which two stimuli are presented at the same time, usually repeatedly for a number of trials, which often results in one stimulus acquiring the function of the other stimulus (ex. your text message sound continously being paired with text messages from friends)"}, {"id": 1790801851461, "deck": "ABSC 850 P2", "q": "Unconditioned Stimulus", "a": "A stimulus that elicts a behaviour without any prior teaching (ex. a loud noise that makes you jump)"}, {"id": 1790801892113, "deck": "ABSC 850 P2", "q": "Neutral stimulus", "a": "A stimulus change that does not elicit respondent behavior"}, {"id": 1790801963590, "deck": "ABSC 850 P2", "q": "Conditioned Stimulus", "a": "A formally neutral stimulus that has been paired with an unconditioned stimulus and as a result can elicit a reflexive behavior."}, {"id": 1790802361721, "deck": "ABSC 850 P2", "q": "Conditioned Response (Reflex)", "a": "An unlearned, automatic response that is elicited by a previously neutral stimulus which has been paired with an unconditioned stimulus that typically elicits the response (sound of refrigerator door opening and the response it elicits which would be salivation)"}, {"id": 1790802400808, "deck": "ABSC 850 P2", "q": "Respondent Extinction", "a": "The procedure of repeatedly presenting a conditioned stimulus without the unconditioned stimulus until the conditioned stimulus no longer elicits the conditioned response"}, {"id": 1790802632292, "deck": "ABSC 850 P2", "q": "Higher Order Conditioning", "a": "Occurs when a second conditioned stimulus becomes associated with an initial conditioned stimulus and evokes an unconditioned response by itself (ex. PTSD where the sights or sounds trigger a nervous system response)"}, {"id": 1790803429489, "deck": "ABSC 850 P2", "q": "Operant Behaviour", "a": "Any behavior determined primarily by its history of consequences. Unlike respondent behavior, which is elicited by antecedent events, operant behavior is selected, shaped, and maintained by the consequences that have followed it in the past (ex. stopping at a red light at an intersection)"}, {"id": 1790803468886, "deck": "ABSC 850 P2", "q": "Selectionism", "a": "A theory that all forms of life naturally and continually evolve as a result of the interaction between function and the survival value of that function. Operant selection by consequences is the conceptual and empirical foundation of behavior analysis"}, {"id": 1790803512173, "deck": "ABSC 850 P2", "q": "Ontogeny", "a": "The history of the development of an individual organism during its lifetime"}, {"id": 1790803544187, "deck": "ABSC 850 P2", "q": "Phylogeny", "a": "The history of the natural evolution of a species"}, {"id": 1790804078145, "deck": "ABSC 850 P2", "q": "Operant Conditioning", "a": "Refers to the process and selective effects of consequences on behavior (Ex. getting gold stars for answering questions correctly on assignment)"}, {"id": 1790804112227, "deck": "ABSC 850 P2", "q": "Reinforcer", "a": "<div>A stimulus change that increases the future frequency of behavior that immediately precedes it<\/div>"}, {"id": 1790804267489, "deck": "ABSC 850 P2", "q": "Punisher", "a": "<div>A stimulus change that decreases the future occurrence of behavior that immediately precedes it<\/div>"}, {"id": 1790804713243, "deck": "ABSC 850 P2", "q": "Automaticity of Reinforcement", "a": "Reinforcement that occurs without us being aware that it is occurring. We don’t have to be aware our behavior is being reinforced for reinforcement to be effective"}, {"id": 1790804764466, "deck": "ABSC 850 P2", "q": "Automatic Reinforcement", "a": "This is a type of reinforcement that does not require someone else to deliver it to you. Your own behavior produces reinforcement"}, {"id": 1790804828232, "deck": "ABSC 850 P2", "q": "Reinforcement", "a": "in which a consequence (stimulus change) is delivered after a behavior and the probability of that behavior occurring in the future increases"}, {"id": 1790804933929, "deck": "ABSC 850 P2", "q": "Positive Reinforcement", "a": "Which a behavior is emitted, a stimulus is added to the environment, and as a result, the behavior is more likely to happen in the future (ex. giving a child a sticker when they clean their room)"}, {"id": 1790805046756, "deck": "ABSC 850 P2", "q": "Negative Reinforcement", "a": "A consequence following a behavior that involves removing someone or one’s self from an aversive situation. By removing an aversive, it increases the future frequency of behavior (ex. taking a tylenol to remove your headache)"}, {"id": 1790805178785, "deck": "ABSC 850 P2", "q": "Aversive Stimulus", "a": "Is any stimulus a person finds unpleasant, distressing, or undesirable—something they will work to avoid, escape, or remove (ex. a food texture someone doesn't like)"}, {"id": 1790805295544, "deck": "ABSC 850 P2", "q": "Punishment", "a": "Has occured when the future frequency of the behavior decreases or is eliminated (ex. The child sticks his finger in the outlet and gets shocked. The child no longer sticks his finger in outlets in the future)"}, {"id": 1790805412727, "deck": "ABSC 850 P2", "q": "Positive Punishment", "a": "Where a behavior is emitted, something is added to the enviroment, and as a result, the behavior is less likely to happen in the future (ex. like a parent yelling after a kid hits their sibling)"}, {"id": 1790805500804, "deck": "ABSC 850 P2", "q": "Negative Punishment", "a": "Is where you take away something that someone likes to decrease the future frequency of a behavior (ex. giving a child a time out)"}, {"id": 1791156000493, "deck": "ABSC 850 P2", "q": "Principle of Behaviour", "a": "Describes a functional relationship between a behaviour and one of its controlling variables"}, {"id": 1791156134221, "deck": "ABSC 850 P2", "q": "Behaviour Change Tactic", "a": "<div><div>A specific strategy or approach used to modify behavior. It involves implementing interventions or techniques based on ABA principles to bring about desired changes in behavior<\/div><\/div><div><div><div><\/div><\/div><\/div>"}, {"id": 1791156447924, "deck": "ABSC 850 P2", "q": "History of Reinforcement", "a": "All of a person's learning experiences and past conditioning with respect to particular response classes or aspects of a person's repertoire"}, {"id": 1791157338647, "deck": "ABSC 850 P3", "q": "Unconditioned Response (UR)", "a": "Responses elicited by antecedent stimuli even though no conditioning or learning has occurred (ex. gag reflex)"}, {"id": 1791157680049, "deck": "ABSC 850 P3", "q": "Trace Conditioning", "a": "The NS (neutral stimulus) preceeds the US, but the the NS ends before the US is presented (ex. in an eyeblink scenario, you present the clicking sound and after the clicking sound stops, then you present the puff of air). This is very effective"}, {"id": 1791157819633, "deck": "ABSC 850 P3", "q": "Delay Conditioning", "a": "The NS is presented and then the US is presented before the NS fades (ex. in the eyeblink, a clicking sound is presented and a puff of air is presented before the clicking sound ends). Is very effective"}, {"id": 1791157959602, "deck": "ABSC 850 P3", "q": "Simultaneous Conditioning", "a": "The NS and US are presented at the exact same time (ex. the puff of air and clicking sound happen at the same time). Not very effective"}, {"id": 1791158062412, "deck": "ABSC 850 P3", "q": "Backward Conditioning", "a": "The US is presented before the NS (ex. the puff of air happens before the clicking). The least effective."}, {"id": 1791158238035, "deck": "ABSC 850 P3", "q": "Conditioned Emotional Responses (CERs)", "a": "A learned, involuntary emotional reaction—such as fear, anxiety, or excitement—triggered by a previously neutral stimulus after it has been paired with an emotionally charged unconditioned stimulus"}, {"id": 1791158345616, "deck": "ABSC 850 P3", "q": "Spontaneous Recovery", "a": "When a CS elicits a CR after extinction has taken place"}, {"id": 1791158535757, "deck": "ABSC 850 P3", "q": "Influences of Respondent Conditioning", "a": "The nature of the US and CS, the temporal relationship between the CS and US, contingency between the CS and US, the number of pairings, and previous exposure to the CS"}, {"id": 1791158765051, "deck": "ABSC 850 P3", "q": "Positive Reinforcement", "a": "the presentation of a stimulus increase behaviour. Can also alter the latency, interresponse time, magnitude, and/or topography of a behaviour"}, {"id": 1791158957665, "deck": "ABSC 850 P3", "q": "Positive Reinforcer", "a": "The stimulus that is presented that increases the behaviour"}, {"id": 1791159436319, "deck": "ABSC 850 P3", "q": "Rule-governed Behaviour", "a": "A rule-governed behavior is a behavior that is under the control of a rule. A person needs to have not come into direct contact with a consequence but engages in a behavior due to a rule (ex. even if you've never received a speeding ticket, you know not to speed because it can lead to a speeding ticket)"}, {"id": 1791159893782, "deck": "ABSC 850 P3", "q": "Unconditioned Reinforcer (Primary Reinforcer)", "a": "A stimulus change that functions as reinforcement even though the learner has had no particular learning history with it (ex. food, water, and oxygen)"}, {"id": 1791160200661, "deck": "ABSC 850 P3", "q": "Conditioned Reinforcers (Secondary Reinforcers)", "a": "A previously neutral stimulus that through stimulus-stimulus pairing with either an UR or CR becomes a reinforcer (ex. praise)"}, {"id": 1791160320604, "deck": "ABSC 850 P3", "q": "Generalized Conditioned Reinforcer", "a": "A reinforcer that has become such due to a history of being paired with other reinforcers (ex. money)"}, {"id": 1791160444633, "deck": "ABSC 850 P3", "q": "Premack Principle (\"First-Then\")", "a": "If you pair a less preferred activity with a more highly preferred activity or reinforcer, then you’re more likely to do that less preferred activity"}, {"id": 1791160600612, "deck": "ABSC 850 P3", "q": "Response-Deprivation Hypothesis", "a": "Access to a behavior can serve as a reinforcer if it is restricted below the individual’s baseline level of engagement. If access to a behavior is limited, and it becomes deprived relative to the individual’s normal level of engagement, it can reinforce other behaviors."}, {"id": 1791160693554, "deck": "ABSC 850 P3", "q": "Stimulus Preference Assessment", "a": "Is a tool used to guide practitioners in providing reinforcement to a client to increase the future probability of a behavior. Plainly, a preference assessment tells us what will motivate an individual at a specific point in time."}, {"id": 1791160813579, "deck": "ABSC 850 P3", "q": "Free Operant Observation", "a": "Observing and recording what activities the target person engages in when they can choose during a period of unrestricted access to numerous activities"}, {"id": 1791160977144, "deck": "ABSC 850 P3", "q": "Reinforcer Assessment", "a": "Refers to a variety of direct, data-based methods used to present one or more stimuli contingent on a target response and then measuring the future effects on the reate of responding."}, {"id": 1791161089303, "deck": "ABSC 850 P3", "q": "Concurrent Schedule of Reinforcement", "a": "When two or more contingencies of reinforcement operate independently and simultaneously for two or more behaviours"}, {"id": 1791161310722, "deck": "ABSC 850 P3", "q": "Multiple Schedule of Reinforcement", "a": "Consists of two or more components of schedules of reinforcement for a single response with only one component schedule in effect at any given time. A discriminative stimulus signals the presence of each component schedule, and that the stimulus is present as long as the schedule is in effect"}, {"id": 1791161445327, "deck": "ABSC 850 P3", "q": "Progressive Ratio Schedule of Reinforcement", "a": "The response requirements for reinforcement are increased systematically over time independent of the participant's behaviour"}, {"id": 1791161679512, "deck": "ABSC 850 P3", "q": "Control", "a": "Requires an experiemental demonstration that the presentation of a stimulus contingent on the occurrance of a target response functions as a positive reinforcement"}, {"id": 1791161876170, "deck": "ABSC 850 P3", "q": "Noncontingent Reinforcement (NCR)", "a": "Is the presentation of a potential reinforcer on a fixed time (FT) or variable time (VT) schedule independent of the occurrance of the target behaviour"}, {"id": 1791162078907, "deck": "ABSC 850 P3", "q": "Differential Reinforcement of Other Behaviour (DRO)", "a": "Delivers a potential reinforcer whenever the target behaviour has not occurred during a set time interval or at a specific point in time"}, {"id": 1791162185210, "deck": "ABSC 850 P3", "q": "Differential Reinforcement of an Alternative Behaviour", "a": "Is used as a control condition. The potential reinforcer is presented contingent on occurrances of a desirable alternative to the target behaviour"}, {"id": 1791328960202, "deck": "ABSC 850 P3", "q": "Escape Contingency", "a": "In which a response terminates (produces escape \nfrom) an ongoing stimulus"}, {"id": 1791329066751, "deck": "ABSC 850 P3", "q": "Avoidance Contingency", "a": "In which a response prevents or \npostpones the presentation of a stimulus"}, {"id": 1791329096908, "deck": "ABSC 850 P3", "q": "Discriminated Avoidance", "a": "In which \nresponding in the presence of a signal prevents the onset of a \nstimulus from which escape is a reinforcer"}, {"id": 1791329294325, "deck": "ABSC 850 P3", "q": "Free-Operant Avoidance", "a": "When the contingency for behavior is that it prevents and/or delays the onset of an aversive stimulus. The avoidant response occurs without the presence of a signal/SD and can occur at any time, during an interval, prior to the scheduled onset of the aversive stimulus."}, {"id": 1791329481019, "deck": "ABSC 850 P3", "q": "Unconditioned Negative Reinforcer", "a": "Stimuli whose removal strengthens behavior in the absence of prior learning (ex. noxious events \nsuch as shock, loud noise, intense light, extremely high or low \ntemperature, or strong pressure against the body)"}, {"id": 1791329677328, "deck": "ABSC 850 P3", "q": "Conditioned Negative Reinforcers", "a": "Which are previously neutral events that \nacquire their effects through pairing with an existing (unconditioned or conditioned) negative reinforcer). Ex. heading home when you see rain clouds outside because they usualyy correlate with bad weather)"}, {"id": 1791332028634, "deck": "ABSC 850 P4", "q": "Schedule of Reinforcement", "a": "Is a rule that describes a con\ntingency of reinforcement, the environmental arrange\nments that determine conditions by which behaviors \nwill produce reinforcement"}, {"id": 1791332139716, "deck": "ABSC 850 P4", "q": "Continous Reinforcement (CRF)", "a": "Provides reinforcement for each occurrence of behavior. For \nexample, a teacher using a continuous schedule of reinforce\nment would praise each occurrence of a correctly identified sight \nword emitted by a student"}, {"id": 1791332220884, "deck": "ABSC 850 P4", "q": "Intermittent schedules of reinforcement (INT)", "a": "Only selected occurrences of behavior produce reinforcement \nwith an intermittent schedule of reinforcement"}, {"id": 1791332385270, "deck": "ABSC 850 P4", "q": "Fixed Ratio (FR)", "a": "Requires the \ncompletion of a fixed number of responses for a reinforcer (ex. A worker might receive a pay credit \nafter completing a specified number of tasks (e.g., assembling \n15 pieces of equipment or picking a box of oranges). FR schedules often produce high rates of response."}, {"id": 1791332675075, "deck": "ABSC 850 P4", "q": "Postreinforcement Pause", "a": "The participant does not respond for a period following \nreinforcement"}, {"id": 1791333138030, "deck": "ABSC 850 P4", "q": "Variable Ratio (VR)", "a": "Requires \nthe completion of a variable number of responses to produce \na reinforcer. A number representing the average (e.g., mean) number of responses required for reinforcement identifies \nthe VR schedule (ex. slot machine). VR schedules produce consistent, steady rates of response. They \ntypically do not produce a postreinforcement pause, as do FR \nschedules"}, {"id": 1791333535406, "deck": "ABSC 850 P4", "q": "Fixed Interval (FI)", "a": "Provides reinforcement for the first response following a fixed duration of \ntime. More time than the \nfixed interval can elapse between reinforced responses. The \nreinforcer is available after the fixed time interval has elapsed, \nand it remains available until the first response. When the first \nresponse occurs sometime after the elapse of a fixed interval, \nthat response is immediately reinforced, and the timing of \nanother fixed interval is usually started with the delivery of the \nreinforcer (ex. getting a paycheck on the same day every 2 weeks). FI schedules typically produce a postreinforcement pause in \nresponding during the early part of the interval."}, {"id": 1791334037778, "deck": "ABSC 850 P4", "q": "Variable Interval (VI)", "a": "Provides \nreinforcement for the first correct response following the elapse \nof variable durations of time. A VI schedule of reinforcement tends to produce a constant, \nstable rate of response (ex. Fishing<b>:<\/b> Sometimes a fish will bite as soon as the line is thrown, but sometimes 40 minutes might pass before getting a bite)"}, {"id": 1791334268121, "deck": "ABSC 850 P4", "q": "Limited Hold", "a": "Reinforce\nment remains available for a finite time following the elapse of \nthe FI or VI interval. The participant will miss the opportunity \nto receive reinforcement if a targeted response does not occur \nwithin the time limit"}, {"id": 1791334414757, "deck": "ABSC 850 P4", "q": "Schedule Thinning", "a": "Refers to gradually increasing the response requirements or decreasing the frequency of reinforcement over time. It involves moving from a denser or more frequent schedule to a thinner or less frequent schedule of reinforcement."}, {"id": 1791334589753, "deck": "ABSC 850 P4", "q": "Ratio Strain", "a": "<b>R<\/b>efers to a condition in which a subject experiences a breakdown in responding due to an abrupt or too-rapid increase in the response-to-reinforcement ratio. In other words, when the demand for the number of responses required to earn reinforcement is increased too quickly, the behavior may weaken or stop entirely. Common behavioral character\nistics associated with ratio strain include avoidance, aggression, \nand unpredictable pauses in responding"}, {"id": 1791335486332, "deck": "ABSC 850 P4", "q": "Differential Reinforcement of High Rates (DRH)", "a": "Involves reinforcing a behavior only if it occurs at a higher rate than a specified criterion. It is used to increase the frequency or rate of a behavior."}, {"id": 1791335603714, "deck": "ABSC 850 P4", "q": "Differential Reinforcement of Low Rates (DRL)", "a": "Involves reinforcing a behavior only if it occurs at a lower rate than a specified criterion. It is used to decrease the frequency or rate of a behavior while allowing some occurrences."}, {"id": 1791335697469, "deck": "ABSC 850 P4", "q": "Inter-response Time", "a": "Identifies the duration of time that occurs between two responses"}, {"id": 1791335880481, "deck": "ABSC 850 P4", "q": "Differential Reinforcement of Diminishing Rates (DRD)", "a": "Provides reinforcement at the end of a predetermined time interval when the number of responses is less than \na criterion that is gradually decreased across time intervals based \non the individual's performance"}, {"id": 1791336039621, "deck": "ABSC 850 P4", "q": "Lag Schedule", "a": "Involves introducing a time delay or lag between the completion of a behavior and the delivery of reinforcement. It aims to increase the persistence or duration of the behavior."}, {"id": 1791336060936, "deck": "ABSC 850 P4", "q": "Progressive Schedule of Reinforcement", "a": "Systematically thins \neach successive reinforcement opportunity within the session \nindependent of the participant's behavior. Progressive-ratio and \ndelay to reinforcement (sometimes called progressive interval, \ntime-based progressive delay, delay fading) schedules of rein\nforcement are used for reinforcer assessment and behavioral \nintervention."}, {"id": 1791336148093, "deck": "ABSC 850 P4", "q": "Progressive Ratio (PR) Schedule of Reinforcement", "a": "Is a type of progressive schedule in which the response requirements increase systematically following each reinforcement delivery. It requires more responses for each subsequent reinforcement."}, {"id": 1791336225978, "deck": "ABSC 850 P4", "q": "Compound Schedules of Reinforcement", "a": "<div><div>Combines two or more simple schedules of reinforcement. It involves presenting different schedules of reinforcement simultaneously or in an alternating pattern.<\/div><\/div>"}, {"id": 1791336296965, "deck": "ABSC 850 P4", "q": "Concurrent Schedule of Reinforcement", "a": "Involves the simultaneous presentation of two or more independent schedules of reinforcement. It allows individuals to choose between different behaviors or response options that are associated with different reinforcement schedules."}, {"id": 1791336357264, "deck": "ABSC 850 P4", "q": "Matching Law", "a": "Describes the relationship between the relative rates of responding and the relative rates of reinforcement for different response options. It suggests that organisms distribute their responses in proportion to the reinforcing value of the available options."}, {"id": 1791336448307, "deck": "ABSC 850 P4", "q": "Multiple Schedule", "a": "Involves alternating or switching between two or more distinct schedules of reinforcement. Each schedule is associated with a different stimulus or context."}, {"id": 1791336491039, "deck": "ABSC 850 P4", "q": "Behavior Contrast", "a": "Refers to a phenomenon where a change in the rate or intensity of reinforcement for one behavior leads to a corresponding change in the opposite direction for another behavior. For example, if reinforcement for one behavior increases, the behavior that receives less reinforcement may decrease."}, {"id": 1791336567541, "deck": "ABSC 850 P4", "q": "Chained Schedule", "a": "A complex schedule of reinforcement that consists of a sequence of multiple simpler schedules. The reinforcement for completing each component of the chain serves as a cue or reinforcer for the next component."}, {"id": 1791336640980, "deck": "ABSC 850 P4", "q": "Mixed Schedule of Reinforcement", "a": "Combines two or more different schedules of reinforcement. It involves presenting different schedules in a random or unpredictable order."}, {"id": 1791336698567, "deck": "ABSC 850 P4", "q": "Tandem Schedule", "a": "Involves presenting two or more schedules of reinforcement in sequence, where completion of the requirements for one schedule leads to the opportunity to engage in the next schedule."}, {"id": 1791336741504, "deck": "ABSC 850 P4", "q": "Alternative Schedule", "a": "Refers to a schedule of reinforcement that provides an alternative behavior as an option to earn reinforcement. It allows individuals to choose between two or more behaviors to receive reinforcement."}, {"id": 1791336803539, "deck": "ABSC 850 P4", "q": "Conjunctive Schedule", "a": "Requires that all specified behaviors or response requirements be completed before reinforcement is delivered. It involves combining multiple response requirements to earn reinforcement."}, {"id": 1791336897632, "deck": "ABSC 850 P4", "q": "Adjunctive Behaviours", "a": "Also known as schedule-induced behaviors or interim behaviors, are behaviors that emerge as a result of certain schedules of reinforcement. They are additional, often repetitive behaviors that occur in the gaps or intervals between scheduled reinforcers."}, {"id": 1791598419470, "deck": "ABSC 850 P5", "q": "Discriminative Stimulus (Sd)", "a": "<span>Is a specific environmental cue or event that signals the availability of reinforcement for a particular behavior. In simpler terms, an SD tells an individual that if they perform a certain action, they will likely receive a desired consequence or reward<\/span>"}, {"id": 1791598515663, "deck": "ABSC 850 P5", "q": "Stimulus Delta", "a": "A stimulus in the environment that signals the non-availability of reinforcerment. For example, if you need to go to the bathroom and there is an Out of Order” sign on the door"}, {"id": 1791598591627, "deck": "ABSC 850 P5", "q": "Stimulus Control", "a": "Behavior that occurs more \noften in the presence of an Sd than in its absence"}, {"id": 1791598691359, "deck": "ABSC 850 P5", "q": "Stimulus Discrimination", "a": "Is the ability to differentiate between or respond differently to two or more stimuli based on their distinct characteristics or properties"}, {"id": 1791598760251, "deck": "ABSC 850 P5", "q": "Stimulus Discrimination Gradient", "a": "Illustrates the extent to which stimuli similar to the original or trained stimulus elicit a response"}, {"id": 1791598948634, "deck": "ABSC 850 P5", "q": "Faulty Stimulus Control", "a": "Occurs when a behviour is triggered by an incorrect or irrelevant stimulus, rather than the appropriate one. In other words, the behavior is under the control of the wrong environmental cue, leading to inappropriate or inconsistent responses. (ex. A child is learning to differentiate between shapes, but when shown a red triangle and a red circle, they consistently choose the red shape rather than focusing on the shape itself)"}, {"id": 1791599141467, "deck": "ABSC 850 P5", "q": "Conditional Discrimination", "a": "The response that will \nproduce reinforcement in the presence of a particular stimulus depends on (is conditional on) the presence or absence of \nother stimuli (ex. Pushing the blue (or red) lever when a friend asks, \n\"Cold (or hot) water please)"}, {"id": 1791599427382, "deck": "ABSC 850 P5", "q": "Stimulus Discrimination Training", "a": "This involves teaching individuals to differentiate between two or more stimuli. Based on the principles of reinforcement, correct responses to one stimulus are reinforced while incorrect responses to another stimulus are not (ex. if you put out 2-3 objects and ask, “Which one is the banana?” the learner engages in discrimination training when he chooses the banana and not the options)"}, {"id": 1791599525780, "deck": "ABSC 850 P5", "q": "Matching-to-Sample", "a": "A procedure where an individual is presented with a sample stimulus and is then required to select or match that stimulus to one or more comparison stimuli"}, {"id": 1791599614587, "deck": "ABSC 850 P5", "q": "Concept", "a": "Refers to a mental representation or category that includes multiple stimuli or events with common characteristics"}, {"id": 1791599866321, "deck": "ABSC 850 P5", "q": "Feature Stimulus Class", "a": "Consists of stimuli that share a common distinctive feature or attribute (ex. different types of dogs)"}, {"id": 1791600024674, "deck": "ABSC 850 P5", "q": "Arbitrary Stimulus Class", "a": "Consists of stimuli that are not inherently related or similar but have been arbitrarily grouped together based on their learned or assigned meaning (ex. the spoken word \"dog,\" the written word DOG, and a manual sign. Or \"dog,\" \"canine,\" and \"hound.\" Or the word for dog across three languages)"}, {"id": 1791600158118, "deck": "ABSC 850 P5", "q": "Response Prompts", "a": "Are cues, hints, or additional instructions provided to an individual to facilitate or guide a correct response (ex. modelling, verbal instructions, physical prompts)"}, {"id": 1791600205902, "deck": "ABSC 850 P5", "q": "Stimulus Prompts", "a": "Are additional stimuli or cues that are added to the antecedent environment to enhance the likelihood of a desired response."}, {"id": 1791600409677, "deck": "ABSC 850 P5", "q": "Factors Affecting the Development of Stimulus Control", "a": "Preattending skills, stimulus salience, overselctive stimulus control, stimulus blocking and overshadowing"}, {"id": 1791600575003, "deck": "ABSC 850 P5", "q": "Overselective Stimulus Control", "a": "Occurs when an individual’s behavior is highly influenced or controlled by a limited range of specific stimuli, to the extent that they fail to respond appropriately to other relevant stimuli in the environment (ex. Students may attend only to the first letter of a word, leading to errors when distinguishing between words like CAT, CAR, and CAP)"}, {"id": 1791600829228, "deck": "ABSC 850 P5", "q": "Stimulus Blocking (Masking)", "a": "Though a stimulus has acquired stimulus control over a behavior, some other competing stimulus masks its evocative function. (Ex. even though Jeremy knows the song and he can play it on the guitar, he seems unable to play when there is an audience present)"}, {"id": 1791600890473, "deck": "ABSC 850 P5", "q": "Overshadowing", "a": "Occurs when the presence of one stimulus interferes with, or overshadows, the acquisition of the stimulus control by some other stimulus. (ex. if you’re watching TV while you’re trying to study)"}, {"id": 1791601010289, "deck": "ABSC 850 P5", "q": "Errorless Learning", "a": "The behavior technician delivers an immediate prompt right after the instruction—before the learner has a chance to make an error—and then systematically fades that prompt over time until the learner can respond independently"}, {"id": 1791601086652, "deck": "ABSC 850 P5", "q": "Most-to-Least Prompts", "a": "The instructor begins with the most intrusive prompt necessary to ensure success and then gradually fades prompts over time"}, {"id": 1791601125564, "deck": "ABSC 850 P5", "q": "Least-to-Most Prompts", "a": "Involves starting with the least intrusive prompt first and gradually increasing assistance only when necessary"}, {"id": 1791601270333, "deck": "ABSC 850 P5", "q": "Time Delay", "a": "Involves introducing a delay between the presentation of an antecedent stimulus or instruction and the delivery of a prompt or cue to elicit a correct response"}, {"id": 1791601332173, "deck": "ABSC 850 P5", "q": "Progressive Time Delay", "a": "Is a teaching procedure that gradually increases the time delay between the presentation of an instruction or cue and the prompt for a correct response"}, {"id": 1791601376298, "deck": "ABSC 850 P5", "q": "Constant Time Delay", "a": "Is a teaching procedure that involves gradually increasing the delay between the presentation of an instruction or cue and the prompt for a correct response."}, {"id": 1791601426374, "deck": "ABSC 850 P5", "q": "Stimulus Fading", "a": "Is a procedure that involves gradually altering or fading out the presence of a prompt or cue to promote independent responding to a target stimulus or situation."}, {"id": 1791682714315, "deck": "ABSC 850 P6", "q": "Establishing Operation (EO)", "a": "A particular type of motivating operation that we use to increase the value of something. We create establishing operations by depriving someone of something they like (ex. food deprivation)"}, {"id": 1791682881512, "deck": "ABSC 850 P6", "q": "Motivating Operation (MO)", "a": "A motivating operation is an environmental event, stimulus, or condition that alters the effectiveness of a consequence and influences the frequency or strength of behavior"}, {"id": 1791682940328, "deck": "ABSC 850 P6", "q": "Abolishing Operation (AO)", "a": "a type of motivating operation that decreases the effectiveness of a reinforcer (ex. feeling full after eating a large meal)"}, {"id": 1791683099314, "deck": "ABSC 850 P6", "q": "Value-Altering Effect", "a": "Refers to the change in the subjective value or significance of a stimulus or event as a result of specific environmental events or stimuli (ex. food is more valuable when you're hungry and less valuable after you've eaten)"}, {"id": 1791683282645, "deck": "ABSC 850 P6", "q": "Behaviour-Altering Effect", "a": "Refers to the influence or impact that certain environmental events or stimuli have on behavior. It can change the frequency, intensity, or form of a behavior by either increasing or decreasing its occurrence (ex. feeling thirsty increases the frequency of behaviours to get water)"}, {"id": 1791683451245, "deck": "ABSC 850 P6", "q": "Evocative Effect", "a": "Refers to the phenomenon where a particular stimulus or event increases the likelihood or frequency of a behavior occurring. It elicits or brings about the behavior by serving as a cue or prompt (ex. deprivation of water increases the current frequency of behavior that has gained you access to food in the past such as going to the fridge)"}, {"id": 1791683675219, "deck": "ABSC 850 P6", "q": "Abative Effect", "a": "Refers to the decrease or reduction in the frequency, intensity, or duration of a behavior as a result of certain environmental events or stimuli. It describes the behavior-suppressing effect that occurs after the presentation or removal of specific stimuli or events (ex. drinking water decreases the behaviours of going to seek out water)"}, {"id": 1791683838628, "deck": "ABSC 850 P6", "q": "Function-Altering Effect", "a": "Refers to the change in the functional relationship between a behavior and its consequences as a result of specific environmental events or stimuli. It alters the contingencies or relationships that control behavior."}, {"id": 1791683885413, "deck": "ABSC 850 P6", "q": "Unconditioned Motivating Operations (UMOs)", "a": "Is a type of motivating operation with a value-altering effect that occurs independent of a learning history (ex. water, food, sleep)"}, {"id": 1791684007670, "deck": "ABSC 850 P6", "q": "Reinforcer-Establishing Effect", "a": "Refers to the increase in the reinforcing effectiveness of a consequence, making it more likely to function as a reinforcer for a behavior (ex. water deprivation establishes water as reinforcer and evokes water seeking behaviors)"}, {"id": 1791684100661, "deck": "ABSC 850 P6", "q": "Reinforcer-Abolishing Effect", "a": "Refers to the decrease or elimination of the reinforcing effectiveness of a consequence, making it less likely to function as a reinforcer for a behavior (ex. drinking water decreases the effectiveness of water as a reinforcer and decreases all water seeking behavior)"}, {"id": 1791684194982, "deck": "ABSC 850 P6", "q": "Conditioned Motivating Operations (CMOs)", "a": "Is a type of motivating operation with a value-altering effect that occurs because of a learning history (ex. praise from friends, getting stickers for reading a book)"}, {"id": 1791684287412, "deck": "ABSC 850 P6", "q": "Surrogate Conditioned Motivating Operation (CMO-S)", "a": "Is a type of motivating operation that gains its effectiveness by being paired with an unconditioned motivating operation (ex. Feeling warm (UMO) was paired with hot cocoa. Now, when I get cold, I start trying to find hot cocoa. Feeling cold has become a CMO-S that increases my desire for cocoa)"}, {"id": 1791684386789, "deck": "ABSC 850 P6", "q": "Reflexive Conditioned Motivating Operation (CMO-R)", "a": "Is a type of “stimulus that systematically precedes the onset of painful stimulation\" (ex. Cats hate the sight of pet carriers because they knew it means they will go to the vet (and cats really don't like the vet). The pet carrier has become a reflexive CMO)"}, {"id": 1791684510534, "deck": "ABSC 850 P6", "q": "Transitive Conditioned Motivating Operation (CMO-T)", "a": "is a type of \"environmental variable\" that \"establishes the effectiveness of another event as a reinforcer or punisher\" (ex. If you are trying to unlock a door, a key becomes a necessary tool to complete the task. The key itself becomes more valuable because it is needed to open the door. The locked door (CMO-T) increases the value of the key as a reinforcer because you need the key to access the room)"}, {"id": 1791930775345, "deck": "ABSC 850 P7", "q": "Punishment", "a": "A consequence that happens after a behaviour that serves to reduce the likelihood of that behaviour happening again in the future (ex. if every time I eat at a certain restaurant, I immediately get a stomach ache, the stomach ache is a punisher that is going to decrease the likelihood of me eating at the restaurant in the future)"}, {"id": 1791930984410, "deck": "ABSC 850 P7", "q": "Unconditioned Punisher", "a": "An unconditioned punisher is a stimulus that acts as punishment independent of the individual's learning history (ex. extreme heat/cold, pain, hunger)"}, {"id": 1791931041068, "deck": "ABSC 850 P7", "q": "Conditioned Punisher", "a": "A conditioned punisher is a stimulus that acts as punishment because of the individual's learning history (ex. People often avoid going to the dentist because they have learned over time that some dental procedures are uncomfortable or anxiety-provoking)"}, {"id": 1791931110059, "deck": "ABSC 850 P7", "q": "Generalized Conditioned Punisher", "a": "Is a punisher that has become such due to a history of being paired with other punishers (ex. Rejection or disapproval: People are often uncomfortable with rejection or disapproval because those stimuli have been paired with other aversive stimuli or situations in the past. They may have become associated with embarrassment, shame, etc)"}, {"id": 1791931381342, "deck": "ABSC 850 P7", "q": "Discriminative Stimulus of Punishment (Sdp)", "a": "Is a cue or signal that indicates when a particular behavior may result in punishment (ex. seeing a speeding camera while driving in the city)"}, {"id": 1791931590119, "deck": "ABSC 850 P7", "q": "Recovery From Punishment", "a": "Refers to the process in which the effects of punishment on behavior diminish over time, and the behavior gradually returns to its previous levels or shows an increase"}, {"id": 1791931834860, "deck": "ABSC 850 P7", "q": "Variables that effect punishment:", "a": "Immediacy, intensity, schedule and consistency, reinforcement for the target behaviour, reinforcement for alternative behaviours"}, {"id": 1791932216399, "deck": "ABSC 850 P7", "q": "Possible Side Effects of Punishment:", "a": "Emotional and aggressive reactions, escape and avoidance, behaviour contrast, possible modelling of undesirable behaviours, may be overused due to negavtive reinforcement"}, {"id": 1791932687982, "deck": "ABSC 850 P7", "q": "Behavioural Contrast", "a": "Refers to a phenomenon where a change in the rate or intensity of reinforcement for one behavior leads to a corresponding change in the opposite direction for another behavior (ex. child who eats cookies at the same rate whether or not their grandmother is present. However, if the grandmother begins to punish or reinforce cookie-eating differently, the child's behavior can change markedly. For example, if cookie eating is punished when she is present, the child's cookie consumption might decrease in her presence but increase when she is absent)"}, {"id": 1791932851623, "deck": "ABSC 850 P7", "q": "Positive Punishment Intervention", "a": "Reprimands, response blocking, response interruption and redirection, contingent exercise, overcorrection"}, {"id": 1791932906850, "deck": "ABSC 850 P7", "q": "Response Blocking", "a": "Is a technique that physically prevents or interrupts an individual from engaging in an undesirable or inappropriate behavior (ex. interventionist blocks a learner's hand from incorrectly placing a block on a block design program)"}, {"id": 1791933296630, "deck": "ABSC 850 P7", "q": "Response Interruption and Redirection (RIRD)", "a": "is a technique used to interrupt and redirect an individual’s inappropriate or unwanted behavior immediately (ex. A 4-year-old child begins throwing wooden blocks across the therapy room for sensory feedback. The therapist calmly uses a positive \"go\" statement: <em>\"Let's do a puzzle instead,\"<\/em> while gently guiding the child's hand toward a colorful, tactile puzzle)"}, {"id": 1791933457236, "deck": "ABSC 850 P7", "q": "Overcorrection", "a": "Is a strategy used to correct inappropriate behavior by requiring an individual to engage in corrective actions that go beyond what is necessary to make amends (ex."}, {"id": 1791933517970, "deck": "ABSC 850 P7", "q": "Restitutional Overcorrection", "a": "Involves the individual repairing the damage caused by their behavior and improving the environment (ex. For example, if a child throws chairs in a classroom, they may be required to restore the furniture to its original state and ensure the area is clean)"}, {"id": 1791933605849, "deck": "ABSC 850 P7", "q": "Positive Practice Overcorrection", "a": "Requires the individual to repeatedly perform the correct behavior to reinforce the appropriate response (ex. Suppose a child accidentally spills a drink. Instead of just cleaning up the child practice pouring the drink correctly several times)"}, {"id": 1791933689364, "deck": "ABSC 850 P7", "q": "Time-Out", "a": "Is a technique where an individual is temporarily removed from a reinforcing environment or social setting for a brief period of time following an inappropriate behavior."}, {"id": 1791933760406, "deck": "ABSC 850 P7", "q": "Nonexclusive Time-Out", "a": "Is a technique where an individual is required to remain in the same environment or setting but loses access to reinforcement or is removed from ongoing reinforcement opportunities for a specified period of time following an inappropriate behavior"}, {"id": 1791933956681, "deck": "ABSC 850 P7", "q": "Planned Ignoring", "a": "Simply ignoring the inappropriate response (ex. a mom in the grocery store ignores their child's temper tantrum because they want a toy)"}, {"id": 1791934055440, "deck": "ABSC 850 P7", "q": "Terminate Specific Reinforcer Contact", "a": "Involves removing access to a specific reinforcer or preferred item immediately following an inappropriate behavior (ex. a child misbehaves during class and is kept in the classroom while the rest of their peers get to go to open gym)"}, {"id": 1791934134243, "deck": "ABSC 850 P7", "q": "Contingent Observation", "a": "Is a technique where an individual is required to observe or watch others engaging in a desired behavior as a consequence for their own inappropriate behavior (ex. I child who is grounded looks out the window and sees their friends playing at the park)"}, {"id": 1791934368968, "deck": "ABSC 850 P7", "q": "Partition of Select-Space Time", "a": "The participant remains in the time-in setting, but his view of the setting is restricted by a panel or cubicle, or a select space is arranged to serve as the time-out area (i.e., a carpet, a corner)."}, {"id": 1791934412102, "deck": "ABSC 850 P7", "q": "Exclusion Time-Out", "a": "Involves removing an individual from a reinforcing environment or social setting for a specific period of time following an inappropriate behavior"}, {"id": 1791934521078, "deck": "ABSC 850 P7", "q": "Desirable Aspects of Time Out", "a": "Ease of application, acceptability, rapid suppression of behaviour, can be combined with other applicants"}, {"id": 1791934709223, "deck": "ABSC 850 P7", "q": "Using Time Out Effectively", "a": "Enrich the time-in environment, define the behaviour(s) that will lead to time-out, determine the form and variation, obtain permission, explain the procedure and rules, determine the duration, apply time-out consistently, establish exit criteria"}, {"id": 1791934797975, "deck": "ABSC 850 P7", "q": "Response Cost", "a": "The response-contingent loss of a specific number of positive reinforcers (e.g., a fine) that decreases the frequency of similar responses in the future; a form of negative punishment (ex. losing money off of their weekly allowance for being mean to their sibling)"}, {"id": 1791935020299, "deck": "ABSC 850 P7", "q": "Bonus Response Cost", "a": "Is a strategy where an individual earns or receives a reward or bonus for displaying desired behavior, and a small portion of that reward or bonus is taken away or reduced as a consequence for inappropriate behavior (ex. a child is able to lose additional tokens from the pool of tokens they already have)"}, {"id": 1791935401378, "deck": "ABSC 850 P8", "q": "Critchfield &amp; Reed (2017): What is the fuzzy concept of ABA research, and why do the authors challenge the strict use of Baer et al.’s seven dimensions?", "a": "Fuzzy concept: ABA research can have varying combinations of characteristics; not every socially important study must demonstrate all seven dimensions equally. Main argument: Strictly requiring all seven dimensions can exclude valuable research addressing socially significant problems."}, {"id": 1791935507561, "deck": "ABSC 850 P8", "q": "Whitehead et al. (1976): What was the purpose, procedure, and main finding of the study on classical conditioning of blood pressure?", "a": "<b>Purpose:<\/b> Determine whether decreases in systolic blood pressure could be classically conditioned. <br><b>Procedure<\/b>: An auditory stimulus (CS) was followed by a 15-degree head-down tilt (US) that elicited a small decrease in blood pressure (UR). <br><b>Findings:<\/b> The auditory stimulus came to produce a conditioned decrease in systolic blood pressure (CR). Conditioning occurred within five trials. <br><b>Control:<\/b> A control group helped rule out sensitization from repeated tilting as the explanation. Significance: Demonstrated that an involuntary physiological response can be modified through respondent conditioning."}, {"id": 1791935634559, "deck": "ABSC 850 P8", "q": "Perone (2003): What is the main argument of Negative Effects of Positive Reinforcement?", "a": "<b>Main argument:<\/b> Positive reinforcement is not automatically harmless or ethical simply because it involves presenting a stimulus. <br><b>Key points:<\/b> Positive reinforcement can have unintended harmful effects; stimuli classified as positive reinforcers can also have aversive functions; the distinction between positive and negative reinforcement can be complex; theory and practical outcomes should inform evaluation. Ethical decisions should consider the individual's well-being and overall consequences. <br><b>Takeaway:<\/b> Evaluate interventions by their actual effects and ethical implications, not merely by whether they are labeled positive reinforcement."}, {"id": 1791935730826, "deck": "ABSC 850 P8", "q": "Lattal &amp; Neef (1996): How do reinforcement schedules, behavioral history, and instructions influence behavior, and what are the implications for ABA?", "a": "<b>Main argument:<\/b> Behavior is influenced not only by current reinforcement schedules but also by prior learning and verbal instructions. <br><b>Key points:<\/b> Reinforcement schedules specify when and how reinforcement is delivered; behavioral history can influence responding under current schedules; verbal instructions can affect human behavior, sometimes independently of direct reinforcement contingencies; dynamic schedules change contingencies over time. ABA implications: Consider learning history, instructions, and changing environmental contingencies when designing and evaluating interventions. <br><b>Takeaway:<\/b> Understand the interaction between current contingencies and learning history."}, {"id": 1791935968102, "deck": "ABSC 850 P8", "q": "Bootzin (1972): What is the purpose of stimulus control treatment for insomnia, and what are its theoretical basis, procedures, and findings?", "a": "<b>Purpose:<\/b> Establish the bed and bedroom as cues for falling asleep. <br><b>Theory: <\/b>Falling asleep is conceptualized as an operant response. Insomnia may develop when the bed becomes associated with wakefulness and incompatible activities. <br><b>Four procedures:<\/b> (1) Go to bed only when sleepy. (2) Do not read or watch TV in the bedroom. (3) If unable to sleep, get up and go to another room. (4) Return when ready to sleep; repeat as needed. Findings: In a case study of one adult, sleep improved substantially within two weeks, with gains maintained during follow-up. <b>Takeaway:<\/b> Stimulus control strengthens the association between bed and sleep while weakening associations with wakefulness."}, {"id": 1791936146348, "deck": "ABSC 850 P8", "q": "Saunders et al. (2016): How can adventitious reinforcement establish maladaptive stimulus control and interfere with learning?", "a": "<b>Main argument:<\/b> Accidental reinforcement of persistent error patterns can establish maladaptive stimulus control that interferes with new and previously mastered discriminations. <br><b>Study:<\/b> A 14-year-old boy with intellectual disabilities was taught to select a correct shape using size fading. Errors increased when the incorrect stimulus was presented at full size, and previously observed switching behavior re-emerged. <br><b>Key findings:<\/b> Errors can inadvertently reinforce incorrect response patterns, such as switching between choices; these patterns can persist and disrupt accurate discrimination; smaller fading steps (5%) and adjustments after every 5 trials reduced errors and improved learning. <br><b>ABA implication:<\/b> Define correct responses precisely, minimize errors, and adjust teaching procedures promptly to prevent reinforcement of maladaptive response patterns."}, {"id": 1791936287633, "deck": "ABSC 850 P8", "q": "Langthorne &amp; McGill: What are motivating operations (MOs), and why are they important in ABA?", "a": "<b>Definition:<\/b> MOs are environmental or contextual variables that temporarily alter a reinforcer’s effectiveness and the current frequency of behaviors associated with that reinforcer. <br><b>Two effects:<\/b> Value-altering changes the effectiveness of a consequence as a reinforcer or punisher; behavior-altering changes the current frequency of behavior associated with that consequence. <br><b>Types:<\/b> Establishing operations increase reinforcer effectiveness; abolishing operations decrease it. Conditioned MOs acquire their effects through learning. ABA implication: Assess motivating conditions when analyzing problem behavior and designing interventions; altering these conditions may reduce problem behavior and increase adaptive alternatives."}, {"id": 1791936414696, "deck": "ABSC 850 P8", "q": "Lerman &amp; Vorndran (2002): What does the research say about punishment, its effectiveness, and its use in ABA?", "a": "<b>Purpose:<\/b> Review basic and applied research on punishment and its use in treating behavior disorders. <br><b>Definition:<\/b> Punishment is a consequence that decreases the future frequency of the behavior it follows. Effectiveness depends on variables such as timing, intensity, schedule, and learning history. Possible side effects include emotional responses, avoidance, or aggression. <br><b>Clinical implications:<\/b> Understand behavioral processes before selecting a procedure. Research gaps: Improve effectiveness, strengthen less intrusive interventions, and safely fade treatment. <br><b>Takeaway:<\/b> Punishment can reduce behavior, but effects depend on multiple variables; prioritize effective, less intrusive alternatives and carefully evaluate outcomes."}, {"id": 1791936525282, "deck": "ABSC 850 P8", "q": "Vollmer (2002): Why does the author argue that punishment research is necessary in ABA, and what cautions should guide its use?", "a": "<b>Main argument: <\/b>Punishment is a natural behavioral phenomenon; a complete science of behavior must study it rather than ignore it. <br><b>Key points:<\/b> Understanding punishment helps explain and address behavior; research can inform treatment decisions for severe problem behavior; decisions should be guided by empirical findings; consider side effects, ethical concerns, and less intrusive alternatives; further research is needed to understand when punishment is effective and how to use behavioral technology responsibly. <br><b>Takeaway:<\/b> Vollmer does not argue for punishment in every case; he argues that punishment should be scientifically studied so its effects and limitations can be understood."}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var cards = DATA.cards, decks = DATA.decks;
  var $ = function(id){return document.getElementById(id)};
  var store = {
    get:function(k,d){try{var v=localStorage.getItem('anki-html:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem('anki-html:'+k,JSON.stringify(v))}catch(e){}}
  };
  var known = store.get('known',{});   // id -> 1 (known) | 0 (again)
  var state = {mode:'study', deck:store.get('deck','all'), shuffle:store.get('shuffle',false),
               reverse:store.get('reverse',false), hideKnown:store.get('hideKnown',false),
               queue:[], i:0, flipped:false, q:''};

  $('total').textContent = cards.length + ' cards · ' + decks.length + ' decks';

  var sel = $('deck');
  function opt(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)}
  opt('all','All decks (' + cards.length + ')');
  decks.forEach(function(d){opt(d, d + ' (' + cards.filter(function(c){return c.deck===d}).length + ')')});
  if(state.deck!=='all' && decks.indexOf(state.deck)<0) state.deck='all';
  sel.value = state.deck;
  $('shuffle').checked = state.shuffle; $('reverse').checked = state.reverse; $('hideKnown').checked = state.hideKnown;

  function pool(){
    return cards.filter(function(c){
      if(state.deck!=='all' && c.deck!==state.deck) return false;
      if(state.hideKnown && known[c.id]===1) return false;
      return true;
    });
  }
  function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function rebuild(){
    var p = pool();
    state.queue = state.shuffle ? shuffled(p) : p;
    state.i = 0; state.flipped = false;
    render();
  }

  function render(){
    if(state.mode==='study') renderStudy(); else renderBrowse();
  }

  function renderStudy(){
    var q = state.queue, stage = $('stage');
    var inDeck = cards.filter(function(c){return state.deck==='all'||c.deck===state.deck});
    var kc = inDeck.filter(function(c){return known[c.id]===1}).length;
    $('bar').style.width = (inDeck.length ? kc/inDeck.length*100 : 0) + '%';
    $('stats').textContent = kc + ' of ' + inDeck.length + ' marked known';
    if(!q.length){
      $('pos').textContent = '';
      stage.innerHTML = '<div class="done"><h2>' + (inDeck.length ? 'All caught up 🎉' : 'No cards here') + '</h2><p style="color:var(--muted)">' +
        (inDeck.length ? 'Every card in this selection is marked known.' : 'Pick another deck.') + '</p>' +
        (inDeck.length ? '<button class="btn primary" id="again">Review everything again</button>' : '') + '</div>';
      var ag = $('again'); if(ag) ag.onclick = function(){
        inDeck.forEach(function(c){delete known[c.id]}); store.set('known',known);
        state.hideKnown=false; $('hideKnown').checked=false; store.set('hideKnown',false); rebuild();
      };
      return;
    }
    if(state.i >= q.length){
      $('pos').textContent = q.length + ' / ' + q.length;
      stage.innerHTML = '<div class="done"><h2>Round complete</h2><p style="color:var(--muted)">You went through all ' + q.length + ' cards.</p>' +
        '<div class="actions"><button class="btn primary" id="restart">Go again</button></div></div>';
      $('restart').onclick = rebuild; return;
    }
    var c = q[state.i];
    var front = state.reverse ? c.a : c.q, back = state.reverse ? c.q : c.a;
    var shown = state.flipped ? back : front;
    $('pos').textContent = (state.i+1) + ' / ' + q.length;
    stage.innerHTML =
      '<div class="card ' + (state.flipped?'is-back':'') + '" id="card" role="button" tabindex="0" aria-label="Flip card">' +
        '<div class="face"><div class="side-label">' + ((state.flipped !== state.reverse) ? 'Answer' : 'Question') + '</div>' +
        '<div class="text">' + shown + '</div><div class="deck-tag">' + c.deck + '</div></div></div>' +
      '<div class="actions">' +
        '<button class="btn" id="prev" ' + (state.i===0?'disabled':'') + '>← Prev</button>' +
        '<button class="btn bad" id="no">Still learning</button>' +
        '<button class="btn good" id="yes">Got it</button>' +
        '<button class="btn" id="next">Next →</button></div>' +
      '<div class="hint"><span class="touch">Tap card to flip · swipe left or right to move</span><span class="kbd"><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> navigate · <kbd>1</kbd> still learning · <kbd>2</kbd> got it</span></div>';
    $('card').onclick = flip;
    $('prev').onclick = function(){go(-1)}; $('next').onclick = function(){go(1)};
    $('yes').onclick = function(){mark(1)}; $('no').onclick = function(){mark(0)};
  }
  function flip(){state.flipped=!state.flipped; renderStudy()}
  function go(d){var n=state.i+d; if(n<0) return; state.i=n; state.flipped=false; renderStudy()}
  function mark(v){
    var c=state.queue[state.i]; if(!c) return;
    known[c.id]=v; store.set('known',known); go(1);
  }

  function renderBrowse(){
    var q = state.q.toLowerCase();
    var res = cards.filter(function(c){
      if(state.deck!=='all' && c.deck!==state.deck) return false;
      if(state.hideKnown && known[c.id]===1) return false;
      return !q || (c.q+' '+c.a).toLowerCase().indexOf(q)>=0;
    });
    $('count').textContent = res.length + ' card' + (res.length===1?'':'s');
    var list = $('list'); list.innerHTML='';
    if(!res.length){list.innerHTML='<div class="empty">No matching cards.</div>';return}
    var frag=document.createDocumentFragment();
    res.forEach(function(c){
      var d=document.createElement('details');
      var k = known[c.id]===1?'k':(known[c.id]===0?'u':'');
      d.innerHTML='<summary><span class="q"><span class="mark '+k+'"></span>'+c.q+'</span><span class="d">'+c.deck+'</span></summary><div class="ans">'+c.a+'</div>';
      frag.appendChild(d);
    });
    list.appendChild(frag);
  }

  function setMode(m){
    state.mode=m;
    $('tab-study').setAttribute('aria-selected',m==='study'); $('tab-browse').setAttribute('aria-selected',m==='browse');
    $('study').hidden = m!=='study'; $('browse').hidden = m!=='browse';
    $('search').hidden = m!=='browse';
    $('shuffle').parentNode.hidden = $('reverse').parentNode.hidden = m!=='study';
    render();
  }
  $('tab-study').onclick=function(){setMode('study')};
  $('tab-browse').onclick=function(){setMode('browse')};
  sel.onchange=function(){state.deck=sel.value;store.set('deck',state.deck);rebuild()};
  $('shuffle').onchange=function(e){state.shuffle=e.target.checked;store.set('shuffle',state.shuffle);rebuild()};
  $('reverse').onchange=function(e){state.reverse=e.target.checked;store.set('reverse',state.reverse);state.flipped=false;render()};
  $('hideKnown').onchange=function(e){state.hideKnown=e.target.checked;store.set('hideKnown',state.hideKnown);rebuild()};
  $('search').oninput=function(e){state.q=e.target.value;renderBrowse()};
  var rp=$('resetProg'), rpTimer=null;
  rp.onclick=function(){
    if(rpTimer){clearTimeout(rpTimer);rpTimer=null;rp.textContent='Reset progress';known={};store.set('known',known);rebuild();return}
    rp.textContent='Tap again to clear all marks';
    rpTimer=setTimeout(function(){rpTimer=null;rp.textContent='Reset progress'},3500);
  };
  var sx=0,sy=0,st=0;
  var stg=$('stage');
  stg.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  stg.addEventListener('touchend',function(e){
    if(state.mode!=='study'||!state.queue.length||state.i>=state.queue.length) return;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-st<800){go(dx<0?1:-1)}
  },{passive:true});

  document.addEventListener('keydown',function(e){
    if(state.mode!=='study'||e.target.matches('input,select,textarea')||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key===' '||e.key==='Enter'){ if(e.target.matches('button')&&e.target.id!=='card')return; e.preventDefault(); if(state.i<state.queue.length) flip() }
    else if(e.key==='ArrowRight'){go(1)} else if(e.key==='ArrowLeft'){go(-1)}
    else if(e.key==='1'){mark(0)} else if(e.key==='2'){mark(1)}
  });

  setMode('study'); rebuild();
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
